<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa · Nate · Hogwarts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="neutral">
  <div class="magic-dust" aria-hidden="true"></div>

  <header class="utility-bar">
    <div class="utility-left">
      <span class="mini-title">LISA · NATE · HOGWARTS</span>
    </div>

    <div class="utility-actions">
      <button id="theme-button" class="utility-button hidden" type="button">
        回到初始配色
      </button>
      <button id="menu-button" class="utility-button" type="button">
        MENU
      </button>
    </div>
  </header>

  <main class="story-shell">
    <article class="story-card">
      <div id="chapter-label" class="chapter-label"></div>
      <h1 id="scene-title"></h1>

      <section id="story-box" class="story-box"></section>


      <form id="birthday-form" class="name-form hidden" autocomplete="off">
        <p class="question-line">你的生日是……？</p>

        <div class="name-grid">
          <label>
            <span>月</span>
            <input
              id="birth-month"
              name="birthMonth"
              type="number"
              inputmode="numeric"
              min="1"
              max="12"
              placeholder="1–12"
              required
            />
          </label>

          <label>
            <span>日</span>
            <input
              id="birth-day"
              name="birthDay"
              type="number"
              inputmode="numeric"
              min="1"
              max="31"
              placeholder="1–31"
              required
            />
          </label>
        </div>

        <button class="primary-button" type="submit">继续</button>
      </form>

      <form id="name-form" class="name-form hidden" autocomplete="off">
        <p class="question-line">你的名字是……？</p>

        <div class="name-grid">
          <label>
            <span>名</span>
            <input id="first-name" name="firstName" maxlength="30" required />
          </label>

          <label>
            <span>姓</span>
            <input id="last-name" name="lastName" maxlength="30" required />
          </label>
        </div>

        <button class="primary-button" type="submit">继续</button>
      </form>


      <form id="custom-line-form" class="name-form hidden" autocomplete="off">
        <p class="question-line">你说：</p>

        <label class="custom-line-label">
          <textarea
            id="custom-line-input"
            name="customLine"
            rows="5"
            maxlength="500"
            placeholder="在这里输入你想对 Susanna 教授说的话……"
            required
          ></textarea>
        </label>

        <button class="primary-button" type="submit">继续</button>
      </form>

      <section id="choices-box" class="choices-box"></section>
    </article>
  </main>

  <aside id="game-menu" class="drawer" aria-hidden="true">
    <button id="menu-backdrop" class="drawer-backdrop" type="button" aria-label="关闭游戏菜单"></button>

    <div class="drawer-panel menu-panel">
      <div class="drawer-header">
        <div>
          <div class="chapter-label">GAME MENU</div>
          <h2>游戏菜单</h2>
        </div>
        <button id="menu-close" class="close-button" type="button" aria-label="关闭">×</button>
      </div>

      <nav class="menu-tabs" aria-label="游戏菜单分页">
        <button class="menu-tab active" data-menu-tab="status" type="button">状态</button>
        <button class="menu-tab" data-menu-tab="save" type="button">存档</button>
        <button class="menu-tab" data-menu-tab="load" type="button">读档</button>
        <button class="menu-tab" data-menu-tab="system" type="button">系统</button>
      </nav>

      <section class="menu-view active" data-menu-view="status">
        <dl class="status-list">
          <div>
            <dt>姓名</dt>
            <dd id="status-name">未填写</dd>
          </div>
          <div>
            <dt>生日</dt>
            <dd id="status-birthday">未填写</dd>
          </div>
          <div>
            <dt>学院</dt>
            <dd id="status-house">未选择</dd>
          </div>
          <div>
            <dt>血统背景</dt>
            <dd id="status-blood">未确定</dd>
          </div>
          <div>
            <dt>Lisa 好感度</dt>
            <dd id="status-lisa">0</dd>
          </div>
          <div>
            <dt>Nate 好感度</dt>
            <dd id="status-nate">0</dd>
          </div>
        </dl>

        <p class="drawer-note">
          当前状态只会在你主动打开菜单时显示。剧情选项本身不会提示好感度变化。
        </p>
      </section>

      <section class="menu-view" data-menu-view="save">
        <p class="menu-intro">选择一个档位保存当前进度。已有档位可以覆盖。</p>
        <div id="save-slots" class="save-slots"></div>
      </section>

      <section class="menu-view" data-menu-view="load">
        <p class="menu-intro">选择一个已有存档，回到保存时的剧情位置。</p>
        <div id="load-slots" class="save-slots"></div>
      </section>

      <section class="menu-view" data-menu-view="system">
        <div class="system-actions">
          <button id="restart-button" class="menu-action-button danger" type="button">
            回到开头
          </button>
          <p class="drawer-note">
            回到开头只会重置当前进行中的游戏，不会删除六个手动存档。
          </p>
        </div>
      </section>
    </div>
  </aside>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modal-title">提示</h2>
      <p id="modal-text"></p>
      <button id="modal-close" class="primary-button" type="button">返回</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HP × Nate × Lisa 文字游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <section class="game-card">
      <header class="topbar">
        <div>
          <div class="eyebrow">HP AU · TEXT GAME</div>
          <h1 id="scene-title">霍格沃茨</h1>
        </div>
        <button id="reset-button" class="ghost-button" type="button">重新开始</button>
      </header>

      <section class="status-panel" aria-label="当前状态">
        <div class="status-item">
          <span>学院</span>
          <strong id="status-house">未选择</strong>
        </div>
        <div class="status-item">
          <span>血统背景</span>
          <strong id="status-blood">未确定</strong>
        </div>
        <div class="status-item">
          <span>Lisa 好感</span>
          <strong id="status-lisa">0</strong>
        </div>
        <div class="status-item">
          <span>Nate 好感</span>
          <strong id="status-nate">0</strong>
        </div>
      </section>

      <section class="visual-slot" aria-label="未来图片区域">
        <div class="visual-placeholder">
          <span>BACKGROUND / SPRITE SLOT</span>
          <small>图片版预留区域：未来可放背景、Lisa / Nate 立绘</small>
        </div>
      </section>

      <section id="story-box" class="story-box"></section>
      <section id="choices-box" class="choices-box"></section>

      <section class="debug-panel">
        <details>
          <summary>开发查看：当前隐藏状态</summary>
          <pre id="debug-state"></pre>
        </details>
      </section>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modal-title">提示</h2>
      <p id="modal-text"></p>
      <button id="modal-close" class="choice-button" type="button">返回</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

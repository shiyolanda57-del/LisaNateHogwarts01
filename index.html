<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa · Nate · Hogwarts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="neutral">
  <div class="magic-dust" aria-hidden="true"></div>

  <header class="utility-bar">
    <div class="utility-left">
      <span class="mini-title">LISA · NATE · HOGWARTS</span>
    </div>

    <div class="utility-actions">
      <button id="theme-button" class="utility-button hidden" type="button">
        回到初始配色
      </button>
      <button id="menu-button" class="utility-button" type="button">
        菜单
      </button>
    </div>
  </header>

  <main class="story-shell">
    <article class="story-card">
      <div id="chapter-label" class="chapter-label"></div>
      <h1 id="scene-title"></h1>

      <section id="story-box" class="story-box"></section>


      <form id="birthday-form" class="name-form hidden" autocomplete="off">
        <p class="question-line">你的生日是……？</p>

        <div class="name-grid">
          <label>
            <span>月</span>
            <input
              id="birth-month"
              name="birthMonth"
              type="number"
              inputmode="numeric"
              min="1"
              max="12"
              placeholder="1–12"
              required
            />
          </label>

          <label>
            <span>日</span>
            <input
              id="birth-day"
              name="birthDay"
              type="number"
              inputmode="numeric"
              min="1"
              max="31"
              placeholder="1–31"
              required
            />
          </label>
        </div>

        <button class="primary-button" type="submit">继续</button>
      </form>

      <form id="name-form" class="name-form hidden" autocomplete="off">
        <p class="question-line">你的名字是……？</p>

        <div class="name-grid">
          <label>
            <span>名</span>
            <input id="first-name" name="firstName" maxlength="30" required />
          </label>

          <label>
            <span>姓</span>
            <input id="last-name" name="lastName" maxlength="30" required />
          </label>
        </div>

        <button class="primary-button" type="submit">继续</button>
      </form>


      <form id="custom-line-form" class="name-form hidden" autocomplete="off">
        <p class="question-line">你说：</p>

        <label class="custom-line-label">
          <textarea
            id="custom-line-input"
            name="customLine"
            rows="5"
            maxlength="500"
            placeholder="在这里输入你想对 Susanna 教授说的话……"
            required
          ></textarea>
        </label>

        <button class="primary-button" type="submit">继续</button>
      </form>

      <section id="choices-box" class="choices-box"></section>
    </article>
  </main>

  <aside id="menu-drawer" class="drawer" aria-hidden="true">
    <button id="drawer-backdrop" class="drawer-backdrop" type="button" aria-label="关闭菜单"></button>

    <div class="drawer-panel">
      <div class="drawer-header">
        <div>
          <div class="chapter-label">GAME MENU</div>
          <h2>菜单</h2>
        </div>
        <button id="drawer-close" class="close-button" type="button" aria-label="关闭">×</button>
      </div>

      <section class="menu-section">
        <h3>当前状态</h3>
        <dl class="status-list">
          <div>
            <dt>姓名</dt>
            <dd id="status-name">未填写</dd>
          </div>
          <div>
            <dt>生日</dt>
            <dd id="status-birthday">未填写</dd>
          </div>
          <div>
            <dt>学院</dt>
            <dd id="status-house">未选择</dd>
          </div>
          <div>
            <dt>血统背景</dt>
            <dd id="status-blood">未确定</dd>
          </div>
          <div>
            <dt>Lisa 好感度</dt>
            <dd id="status-lisa">0</dd>
          </div>
          <div>
            <dt>Nate 好感度</dt>
            <dd id="status-nate">0</dd>
          </div>
        </dl>
      </section>

      <section class="menu-section">
        <div class="menu-section-heading">
          <h3>存档 / 读档</h3>
          <span>6 个档位</span>
        </div>
        <div id="save-slots" class="save-slots"></div>
      </section>

      <section class="menu-section menu-actions">
        <button id="restart-button" class="secondary-button danger-button" type="button">
          回到开头
        </button>
      </section>

      <p class="drawer-note">
        游戏会自动记住当前进度。刷新页面后会回到你最近停留的位置；手动存档不会因“回到开头”而删除。
      </p>
    </div>
  </aside>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modal-title">提示</h2>
      <p id="modal-text"></p>
      <button id="modal-close" class="primary-button" type="button">返回</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
